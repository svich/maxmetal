# macOS: library, CLI and tests (universal); iOS: the library, device and simulator; all three in maxmetal.xcframework.
# A v* tag publishes maxmetal.xcframework.zip and maxmetal-macos.tar.gz as a release.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write  # the release

jobs:
  build:
    runs-on: macos-latest
    env:
      MACOS_MIN: '11.0'
      IOS_MIN: '14.0'
    steps:
      - uses: actions/checkout@v7

      - name: Metal compiler  # (metal_compile test; Xcode 26 on ships it as a separate component)
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain

      - name: macOS
        run: |
          cmake -S . -B build/macos -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOS_MIN
          cmake --build build/macos -j
          ctest --test-dir build/macos --output-on-failure

      - name: iOS
        run: |
          cmake -S . -B build/ios -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=$IOS_MIN
          cmake --build build/ios -j
          cmake -S . -B build/ios-sim -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=$IOS_MIN
          cmake --build build/ios-sim -j

      - name: Package
        run: |
          mkdir dist
          xcodebuild -create-xcframework -output dist/maxmetal.xcframework \
            -library build/macos/libmaxmetal.a -headers include \
            -library build/ios/libmaxmetal.a -headers include \
            -library build/ios-sim/libmaxmetal.a -headers include
          cp -R LICENSE licenses dist/
          (cd dist && zip -qry maxmetal.xcframework.zip maxmetal.xcframework LICENSE licenses)
          cmake --install build/macos --prefix dist/maxmetal-macos
          cp -R LICENSE licenses dist/maxmetal-macos/
          tar -C dist -czf dist/maxmetal-macos.tar.gz maxmetal-macos

      - uses: actions/upload-artifact@v7
        with:
          name: maxmetal
          path: |
            dist/maxmetal.xcframework.zip
            dist/maxmetal-macos.tar.gz

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/maxmetal.xcframework.zip dist/maxmetal-macos.tar.gz --generate-notes
